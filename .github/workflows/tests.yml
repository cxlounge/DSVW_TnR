name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install requirements
        run: python3 -m pip install --upgrade pip && python3 -m pip install -r requirements.txt

      - name: Check line count (< 100 LoC)
        run: test "$(wc -l < dsvw.py)" -lt 100

      - name: Run tests
        run: python3 -m unittest discover -s tests -t tests -v

  legacy-lxml:                                        # libxml2 < 2.13 still carries its own HTTP client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install legacy lxml
        run: python3 -m pip install --upgrade pip && python3 -m pip install "lxml==5.2.1"

      - name: Run tests
        run: python3 -m unittest discover -s tests -t tests -v
